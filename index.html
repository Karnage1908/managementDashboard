<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command — Personal Academic & Professional Dashboard</title>

  <meta name="description"
    content="Personal academic and professional management command center. Track courses, career goals, job applications, projects, and skills.">
  <meta name="theme-color" content="#00ff9d">

  <!-- Favicon (Cyber HUD Neon Green Terminal) -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a1012' stroke='%2300ff9d' stroke-width='2'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='bold' font-size='18' fill='%2300ff9d'%3E%3E_%3C/text%3E%3C/svg%3E">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Command — Personal Executive Dashboard">
  <meta property="og:description"
    content="Track academic, career, project, and skill development in one single command center.">
  <meta property="og:type" content="website">

  <!-- CDNs: Chart.js & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Restore Redirect from 404.html (for GitHub Pages subpaths) -->
  <script>
    (function () {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>
</head>

<body>
  <!-- App Shell Mount Point -->
  <div id="app" class="app"></div>

  <!-- JavaScript Modules -->
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/router.js"></script>

  <!-- Components -->
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/modal.js"></script>

  <!-- Pages -->
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/academic.js"></script>
  <script src="js/pages/professional.js"></script>
  <script src="js/pages/applications.js"></script>
  <script src="js/pages/projects.js"></script>
  <script src="js/pages/tasks.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/goals.js"></script>
  <script src="js/pages/skills.js"></script>
  <script src="js/pages/achievements.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/documents.js"></script>
  <script src="js/pages/settings.js"></script>

  <!-- App Bootstrap -->
  <script src="js/app.js"></script>
</body>

</html>
